[package]
name = "dig-clvm"
version = "0.4.0"
edition = "2021"
rust-version = "1.75.0"
description = "DIG L2 CLVM consensus engine — validates spend bundles, computes coin additions and removals"
license = "MIT"
authors = ["DIG Network"]
repository = "https://github.com/DIG-Network/dig-clvm"

[lib]
path = "src/lib.rs"

[dependencies]
# CLVM runtime
clvmr = "0.16.2"
clvm-traits = "0.36.1"
clvm-utils = "0.36.1"

# Chia protocol & consensus
chia-protocol = "0.36.1"
chia-consensus = "0.36.1"
chia-bls = "0.36.1"
chia-traits = "0.36.1"

# Chia SDK (individual crates, not the umbrella)
chia-sdk-types = "0.36.0"
chia-sdk-driver = { version = "0.36.0", features = ["action-layer"] }
chia-sdk-coinset = "0.36.0"
chia-puzzles = "0.20.3"

# DIG ecosystem
dig-constants = "0.10"

# Minimal own dependencies
thiserror = "2"
hex = "0.4"

[dev-dependencies]
chia-sdk-test = "0.36.0"
hex-literal = "0.4"
rand = "0.8"
sha2 = "0.10"
